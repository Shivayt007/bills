plugins {
    id 'com.android.application'
}

android {
    namespace 'com.satraders.billing'
    compileSdk 35

    defaultConfig {
        applicationId 'com.satraders.billing'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def webAssetNames = [
        'index.html',
        'app.css',
        'app.js',
        'ui-2026.css',
        'ui-2026.js',
        'ui-global.css',
        'ui-fixes.css',
        'ui-fixes.js',
        'invoice-2026.css',
        'invoice-2026.js',
        'next-cycle-2026.js',
        'premium-theme.css'
]

def generatedWebAssets = layout.buildDirectory.dir('generated/satraders-assets')

tasks.register('syncWebAssets') {
    outputs.dir(generatedWebAssets)
    doLast {
        def outDir = generatedWebAssets.get().asFile
        outDir.mkdirs()
        webAssetNames.each { name ->
            def target = new File(outDir, name)
            def url = new URL("https://raw.githubusercontent.com/Shivayt007/bills/main/${name}")
            println "Fetching ${name}"
            target.withOutputStream { os ->
                url.openConnection().with { c ->
                    connectTimeout = 20000
                    readTimeout = 30000
                    setRequestProperty('User-Agent', 'SATraders-Android-Build')
                    inputStream.withCloseable { input -> input.transferTo(os) }
                }
            }
        }
    }
}

android.sourceSets.main.assets.srcDir(generatedWebAssets)

tasks.named('preBuild').configure { dependsOn('syncWebAssets') }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
