plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.satraders.billing'
    compileSdk 35

    defaultConfig {
        applicationId 'com.satraders.billing'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '1.8.0'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'distribution'
    productFlavors {
        website {
            dimension 'distribution'
            buildConfigField 'boolean', 'PAYMENT_DETECTION_ENABLED', 'false'
        }
        full {
            dimension 'distribution'
            buildConfigField 'boolean', 'PAYMENT_DETECTION_ENABLED', 'true'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
            }
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def webAssetNames = [
        'index.html',
        'firebase-db.js',
        'app.js',
        'ui-2026.js',
        'ui-fixes.js',
        'reference-ui.js',
        'invoice-2026.js',
        'next-cycle-2026.js',
        'invoice-share.js',
        'notifications-2026.js',
        'app.bundle.min.css',
        'sa-traders-logo.jpg',
        'vendor/html2canvas.min.js'
]

def repositoryWebRoot = rootProject.projectDir.parentFile
def webAssetSource = new File(repositoryWebRoot, 'app.js').exists() ? repositoryWebRoot : file('src/main/assets')
def generatedWebAssets = layout.buildDirectory.dir('generated/satraders-assets')

tasks.register('syncWebAssets', Copy) {
    from(webAssetSource) { webAssetNames.each { name -> include(name) } }
    into(generatedWebAssets)
}

android.sourceSets.main.assets.setSrcDirs([generatedWebAssets])
tasks.named('preBuild').configure { dependsOn('syncWebAssets') }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.guava:guava:33.2.1-android'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-firestore'
}

// Fail before a release build rather than accidentally producing an unsigned APK.
tasks.configureEach { task ->
    if (task.name.startsWith('pre') && task.name.endsWith('ReleaseBuild')) {
        task.doFirst {
            ['KEYSTORE_FILE', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].each { name ->
                if (!System.getenv(name)) {
                    throw new GradleException("Missing release signing environment variable: ${name}")
                }
            }
            if (!file(System.getenv('KEYSTORE_FILE')).isFile()) {
                throw new GradleException('Release keystore file was not found')
            }
        }
    }
}
