name: Fix duplicate bill handling

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-duplicate-bill.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch preview JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          s=s.replace("""function toast(msg,type='success'){
            const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg;
            $('#toasts').appendChild(el); setTimeout(()=>el.remove(),3200);
            if(window.Android?.toast) try{ Android.toast(msg); }catch(_e){}
          }
          ""","""function toast(msg,type='success'){
            const stack=$('#toasts'); if(!stack)return;
            const key=type+'|'+String(msg);
            for(const old of Array.from(stack.children)) if(old.dataset.toastKey===key) old.remove();
            const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; el.dataset.toastKey=key;
            stack.appendChild(el); while(stack.children.length>3) stack.firstElementChild?.remove();
            setTimeout(()=>el.remove(),3200);
            if(window.Android?.toast) try{ Android.toast(msg); }catch(_e){}
          }
          """,1)
          s=s.replace("async function nextSeq(key){ const v=i(await setting(key,0))+1; await setSetting(key,v); return v; }\n","""async function nextSeq(key){ const v=i(await setting(key,0))+1; await setSetting(key,v); return v; }
          async function nextAvailableBillNo(){
            const bills=await DB.all('bills'); const used=new Set(bills.map(b=>String(b.bill_no??'').trim()).filter(Boolean));
            const nums=[...used].filter(x=>/^\\d+$/.test(x)).map(Number); let x=nums.length?Math.max(...nums)+1:1;
            while(used.has(String(x)))x++; return String(x);
          }
          """,1)
          s=s.replace("const editing=id&&id!=='new'; let old={}; if(editing){old=await DB.get('bills',id); if(!old){toast('Bill not found','danger');SA.go('dashboard');return}}\n  shell(billFormHtml(old,editing),'home');","const editing=id&&id!=='new'; let old={}; if(editing){old=await DB.get('bills',id); if(!old){toast('Bill not found','danger');SA.go('dashboard');return}} else {old.bill_no=await nextAvailableBillNo();}\n  shell(billFormHtml(old,editing),'home');",1)
          s=s.replace("if(!editing&&await DB.get('bills',b.bill_no))throw new Error('Duplicate bill number is not allowed');","if(!editing&&await DB.get('bills',b.bill_no)){const suggestion=await nextAvailableBillNo();form.elements.bill_no.value=suggestion;toast(`Bill number ${b.bill_no} already exists. Next available number is ${suggestion}.`,'danger');form.elements.bill_no.focus();return}",1)
          p.write_text(s)
          PY
          node --check app.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix duplicate bill number handling' || exit 0
          git push
