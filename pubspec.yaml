name: sa_traders_billing
description: Native Flutter S.A Traders rental billing app.
publish_to: none
version: 2.0.6+28
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.1.0
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  file_picker: 11.0.3
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.5.4
  shared_preferences: ^2.5.3
  notification_listener_service: ^1.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true
  assets:
    - assets/sa-traders-logo.jpg
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/sa-traders-logo.jpg
  adaptive_icon_background: '#05637F'
  adaptive_icon_foreground: assets/sa-traders-logo.jpg
flutter_native_splash:
  color: '#05637F'
  image: assets/sa-traders-logo.jpg
  android: true
  ios: false
