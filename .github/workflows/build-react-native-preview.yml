name: Build genuine React Native S.A Traders APK

on:
  push:
    branches:
      - feature/react-native-complete-audit-20261025
    paths:
      - 'react-native/**'
      - '.github/workflows/build-react-native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use hosted runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install required Android platform
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install React Native dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Java/JS integration readiness
        run: npm run check

      - name: Check native rental calculations
        run: npm test

      - name: Test legacy JSON backup and merge parity
        run: node scripts/backup-parity-check.cjs

      - name: Type-check React Native UI
        run: npm run typecheck

      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        env:
          CI: '1'
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: S-A-Traders-React-Native-v0.3.0-APK
          path: react-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
