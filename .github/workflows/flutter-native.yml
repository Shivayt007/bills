name: Flutter native billing app
on:
  push:
    branches: [flutter-native-port]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: dart run flutter_native_splash:create
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: bill-details-preview
          path: build/previews/*.png
          if-no-files-found: error
      - name: Decode existing S.A Traders release keystore
        if: ${{ !contains(github.event.head_commit.message, '[preview]') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'KEYSTORE_BASE64 is missing'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/satraders-release.jks"
          test -s "$RUNNER_TEMP/satraders-release.jks"
      - name: Build signed release APK
        if: ${{ !contains(github.event.head_commit.message, '[preview]') }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/satraders-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Verify APK signature
        if: ${{ !contains(github.event.head_commit.message, '[preview]') }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: ${{ !contains(github.event.head_commit.message, '[preview]') }}
        with:
          name: sa-traders-flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/satraders-release.jks"
