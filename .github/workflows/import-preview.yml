name: Import S.A Traders Preview

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-preview.yml'

permissions:
  contents: write

jobs:
  import-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download preview package
        run: |
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b3bc-8211-8b5b-56dc13f1237e/raw?se=2026-10-11T19%3A54%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=6dd3456a-bd6b-5588-ae24-dd177ad6ab6b&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T02%3A49%3A46Z&ske=2026-10-12T02%3A49%3A46Z&sks=b&skv=2026-02-06&sig=5CxvFDhNzqKS2%2BD7QdSXiVV3eUx72%2BZWHTBAHsT/2XQ%3D' -o preview.zip
          rm -rf preview-import
          mkdir preview-import
          unzip -o preview.zip -d preview-import
          cp preview-import/index.html ./index.html
          cp preview-import/app.css ./app.css
          cp preview-import/app.js ./app.js
          test -s index.html
          test -s app.css
          test -s app.js
          node --check app.js

      - name: Commit preview files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.css app.js
          if git diff --cached --quiet; then
            echo 'Preview already up to date.'
            exit 0
          fi
          git commit -m 'Publish S.A Traders web preview'
          git push
