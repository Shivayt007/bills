name: Build signed S.A Traders release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Verify reminders and payment parsing
        run: |
          node tests/notifications-test.cjs
          mkdir -p "$RUNNER_TEMP/parser-test"
          javac -d "$RUNNER_TEMP/parser-test" android-app/app/src/main/java/com/satraders/billing/PaymentParser.java tests/payment-parser-test.java
          java -cp "$RUNNER_TEMP/parser-test" PaymentParserTest

      - name: Verify notification UI on mobile and desktop
        env:
          SA_PLAYWRIGHT: ${{ runner.temp }}/sa-ui/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/sa-ui" playwright@1.62.1
          "$RUNNER_TEMP/sa-ui/node_modules/.bin/playwright" install --with-deps chromium
          node tests/ui-test.cjs

      - name: Upload notification UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-ui-previews
          path: /tmp/sa-notifications-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'KEYSTORE_BASE64 is missing'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/satraders-release.jks"
          test -s "$RUNNER_TEMP/satraders-release.jks"

      - name: Build signed release APK and Play bundle
        working-directory: android-app
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/satraders-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleWebsiteRelease assembleFullRelease bundleFullRelease

      - name: Verify APK signature and record checksum
        run: |
          APK=android-app/app/build/outputs/apk/website/release/app-website-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n '1p'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/website-manifest.txt"
          if grep -Eq 'BIND_NOTIFICATION_LISTENER_SERVICE|NotificationListenerService|PaymentNotificationService|READ_SMS|RECEIVE_SMS|BIND_ACCESSIBILITY_SERVICE' "$RUNNER_TEMP/website-manifest.txt"; then
            echo 'Website APK contains unexpected sensitive access'
            exit 1
          fi
          echo 'Verified: website APK has no notification listener, SMS reader, or accessibility service'
          cd android-app/app/build/outputs/apk/website/release
          sha256sum app-website-release.apk > app-website-release.apk.sha256

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: S-A-Traders-v1.8.0-website-APK
          path: |
            android-app/app/build/outputs/apk/website/release/app-website-release.apk
            android-app/app/build/outputs/apk/website/release/app-website-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify full APK signature and payment detection service
        run: |
          APK=android-app/app/build/outputs/apk/full/release/app-full-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n '1p'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/full-manifest.txt"
          grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE' "$RUNNER_TEMP/full-manifest.txt"
          grep -q 'PaymentNotificationService' "$RUNNER_TEMP/full-manifest.txt"
          echo 'Verified: full APK retains payment notification access'
          cd android-app/app/build/outputs/apk/full/release
          sha256sum app-full-release.apk > app-full-release.apk.sha256

      - name: Upload full release APK with payment detection
        uses: actions/upload-artifact@v4
        with:
          name: S-A-Traders-v1.8.0-full-APK
          path: |
            android-app/app/build/outputs/apk/full/release/app-full-release.apk
            android-app/app/build/outputs/apk/full/release/app-full-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: S-A-Traders-v1.8.0-full-AAB
          path: android-app/app/build/outputs/bundle/fullRelease/app-full-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload shrinker mapping
        uses: actions/upload-artifact@v4
        with:
          name: S-A-Traders-release-mapping
          path: |
            android-app/app/build/outputs/mapping/websiteRelease/mapping.txt
            android-app/app/build/outputs/mapping/fullRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/satraders-release.jks"

