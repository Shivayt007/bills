name: Build S.A Traders Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/sa-traders-v1.8.0 ]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android-app/**'
      - 'index.html'
      - 'firebase-db.js'
      - 'app.bundle.min.css'
      - 'reference-ui.js'
      - 'notifications-2026.js'
      - 'app.css'
      - 'app.js'
      - 'ui-2026.css'
      - 'ui-2026.js'
      - 'ui-global.css'
      - 'ui-fixes.css'
      - 'ui-fixes.js'
      - 'invoice-2026.css'
      - 'invoice-2026.js'
      - 'next-cycle-2026.js'
      - 'premium-theme.css'
      - 'invoice-share.js'
      - 'vendor/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK path
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify reminders, backup compatibility and payment parsing
        run: |
          node tests/notifications-test.cjs
          mkdir -p /tmp/sa-parser-test
          javac -d /tmp/sa-parser-test android-app/app/src/main/java/com/satraders/billing/PaymentParser.java tests/payment-parser-test.java
          java -cp /tmp/sa-parser-test PaymentParserTest

      - name: Check mobile and desktop workflows
        run: |
          npm install --prefix /tmp/sa-ui playwright
          /tmp/sa-ui/node_modules/.bin/playwright install --with-deps chromium
          node tests/ui-test.cjs

      - name: Build debug APK
        run: ./android-app/gradlew -p android-app assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S-A-Traders-Android-APK
          path: android-app/app/build/outputs/apk/full/debug/app-full-debug.apk
          if-no-files-found: error

