name: Fix IndexedDB get and cache

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-indexeddb-get.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix IndexedDB get result and bust cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "tx.oncomplete=()=>resolve(result?.result ?? result); tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error||new Error('DB transaction aborted'));"
          new = "tx.oncomplete=()=>{ if(result && typeof result==='object' && 'result' in result) resolve(result.result); else resolve(result); }; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error||new Error('DB transaction aborted'));"
          if old not in s:
              raise SystemExit('Expected IndexedDB line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          h = Path('index.html')
          t = h.read_text()
          t = t.replace('href="app.css"', 'href="app.css?v=20261012-0202"')
          t = t.replace('src="app.js"', 'src="app.js?v=20261012-0202"')
          h.write_text(t)
          PY
          node --check app.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Fix empty IndexedDB get false duplicate bills'
          git push
