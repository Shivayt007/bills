plugins {
    id 'com.android.application'
}

android {
    namespace 'com.satraders.billing'
    compileSdk 35

    defaultConfig {
        applicationId 'com.satraders.billing'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def webAssetNames = [
        'index.html',
        'app.css',
        'app.js',
        'ui-2026.css',
        'ui-2026.js',
        'ui-global.css',
        'ui-fixes.css',
        'ui-fixes.js',
        'invoice-2026.css',
        'invoice-2026.js',
        'next-cycle-2026.js',
        'premium-theme.css',
        'invoice-share.js',
        'vendor/html2canvas.min.js'
]

def generatedWebAssets = layout.buildDirectory.dir('generated/satraders-assets')

// Package the exact checked-out source, with no mutable remote download.
tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        webAssetNames.each { name -> include(name) }
    }
    into(generatedWebAssets)
}

android.sourceSets.main.assets.srcDir(generatedWebAssets)

tasks.named('preBuild').configure { dependsOn('syncWebAssets') }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}

